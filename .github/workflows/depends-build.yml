name: Depends Build

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            make: make
            cache-id: ubuntu-22.04-linux-x86_64-hwi
            platform: linux
            artifact: bitcoin-qml-hwi-test-x86_64-linux-gnu.tar.gz
          - name: macos-arm64
            os: macos-15
            host: ""
            make: gmake
            cache-id: macos-15-arm64-hwi
            platform: macos
            artifact: Bitcoin-QML-HWI-test-arm64-macos.zip

    env:
      BUILD_DIR: build-depends
      DEPENDS_PATCH: patches/depends-Add-Qt-Qml-and-Qt-Quick-modules.patch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            curl \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            libusb-1.0-0-dev \
            libxcb-cursor0 \
            xauth \
            xvfb \
            xz-utils
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bison cmake libusb make ninja pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hwi/poetry.lock

      - name: Install pinned HWI build frontend
        run: python -m pip install "poetry==2.3.1"

      - name: Build HWI one-folder sidecar
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            hwi_libusb=/usr/lib/x86_64-linux-gnu/libusb-1.0.so.0
          else
            hwi_libusb="$(brew --prefix libusb)/lib/libusb-1.0.dylib"
          fi
          test -f "${hwi_libusb}"
          (
            cd hwi
            HWI_LIBUSB_PATH="${hwi_libusb}" contrib/build_sidecar.sh
            poetry run python -m unittest test.test_sidecar_manifest
          )
          test -x hwi/dist/hwi/hwi
          hwi/dist/hwi/hwi --version

      - name: Finalize HWI Mach-O signatures
        if: runner.os == 'macOS'
        run: |
          python contrib/macos_ad_hoc_sign.py hwi/dist/hwi
          (
            cd hwi
            poetry run python contrib/generate_sidecar_manifest.py dist/hwi
          )

      - name: Authorize untrusted test sidecar
        run: |
          test_key="${RUNNER_TEMP}/hwi-manifest-test.key"
          python contrib/generate_hwi_test_key.py "${test_key}"
          sign_output="$(
            python bitcoin/contrib/hwi/sign_hwi_manifest.py \
              hwi/dist/hwi/hwi-manifest.json \
              --private-key-file "${test_key}"
          )"
          public_key="$(printf '%s\n' "${sign_output}" | sed -n 's/^public_key=//p')"
          if ! printf '%s\n' "${public_key}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Signing helper returned an invalid public key"
            exit 1
          fi
          printf '%s\n' "${sign_output}"
          echo "HWI_MANIFEST_PUBKEY=${public_key}" >> "$GITHUB_ENV"

      - name: Select depends host
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            test "$(uname -m)" = "arm64"
          fi
          if [ -n "${{ matrix.host }}" ]; then
            host="${{ matrix.host }}"
          else
            host="$(cd bitcoin/depends && ./config.guess)"
          fi
          host="$(cd bitcoin/depends && ./config.sub "$host")"
          echo "HOST=${host}" >> "$GITHUB_ENV"
          echo "Using depends host: ${host}"

      - name: Apply Bitcoin depends patch
        run: |
          if [ ! -f "${DEPENDS_PATCH}" ]; then
            echo "::error::Missing ${DEPENDS_PATCH}"
            exit 1
          fi

          patch="../${DEPENDS_PATCH}"
          if git -C bitcoin apply --whitespace=nowarn --reverse --check "${patch}" >/dev/null 2>&1; then
            echo "${DEPENDS_PATCH} is already applied"
          else
            git -C bitcoin apply --whitespace=nowarn --check "${patch}"
            git -C bitcoin apply --whitespace=nowarn "${patch}"
          fi

      - name: Restore depends sources cache
        uses: actions/cache/restore@v4
        id: depends-sources-cache
        with:
          path: bitcoin/depends/sources
          key: ${{ matrix.cache-id }}-depends-sources-${{ hashFiles('bitcoin/depends/packages/*.mk', 'bitcoin/depends/patches/**', 'patches/*.patch') }}
          restore-keys: |
            ${{ matrix.cache-id }}-depends-sources-

      - name: Restore depends package cache
        uses: actions/cache/restore@v4
        id: depends-built-cache
        with:
          path: bitcoin/depends/built
          key: ${{ matrix.cache-id }}-depends-built-${{ hashFiles('bitcoin/depends/Makefile', 'bitcoin/depends/funcs.mk', 'bitcoin/depends/builders/**', 'bitcoin/depends/hosts/**', 'bitcoin/depends/packages/*.mk', 'bitcoin/depends/patches/**', 'patches/*.patch') }}
          restore-keys: |
            ${{ matrix.cache-id }}-depends-built-

      - name: Build depends
        run: |
          cd bitcoin/depends
          ${{ matrix.make }} -j"${JOBS}" HOST="${HOST}" DEBUG= LOG=1

      - name: Save depends sources cache
        uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.depends-sources-cache.outputs.cache-hit != 'true'
        with:
          path: bitcoin/depends/sources
          key: ${{ steps.depends-sources-cache.outputs.cache-primary-key }}

      - name: Save depends package cache
        uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.depends-built-cache.outputs.cache-hit != 'true'
        with:
          path: bitcoin/depends/built
          key: ${{ steps.depends-built-cache.outputs.cache-primary-key }}

      - name: Configure
        run: |
          test -f "bitcoin/depends/${HOST}/toolchain.cmake"
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/bitcoin/depends/${HOST}/toolchain.cmake" \
            -DBUILD_APP_TESTS=OFF \
            -DBUILD_GUI=ON \
            -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF \
            -DBUNDLED_HWI_DIR="${PWD}/hwi/dist/hwi" \
            -DHWI_MANIFEST_PUBKEY="${HWI_MANIFEST_PUBKEY}"

      - name: Build bitcoin-core-app
        run: |
          cmake --build "${BUILD_DIR}" --target bitcoin-core-app --parallel "${JOBS}"

      - name: Test artifact assembly
        run: python -m unittest test.test_hwi_packaging

      - name: Report Linux ABI requirements
        if: runner.os == 'Linux'
        run: |
          mkdir -p build-hwi-abi/bin build-hwi-abi/libexec
          cp "${BUILD_DIR}/bin/bitcoin-core-app" build-hwi-abi/bin/
          cp -a hwi/dist/hwi build-hwi-abi/libexec/hwi
          python contrib/linux_abi_report.py \
            build-hwi-abi \
            --output "${BUILD_DIR}/linux-abi-report.json"
          ABI_REPORT="${BUILD_DIR}/linux-abi-report.json" python -c \
            'import json, os; version=json.load(open(os.environ["ABI_REPORT"]))["maximum_glibc"]; assert version is not None and tuple(map(int, version.split("."))) <= (2, 35), version'

      - name: Package Linux test artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          python contrib/package_hwi_app.py \
            --platform linux \
            --app "${BUILD_DIR}/bin/bitcoin-core-app" \
            --hwi-dir hwi/dist/hwi \
            --public-key "${HWI_MANIFEST_PUBKEY}" \
            --abi-report "${BUILD_DIR}/linux-abi-report.json" \
            --output "dist/${{ matrix.artifact }}"
          tar -tzf "dist/${{ matrix.artifact }}" | grep -Fx 'bitcoin-qml-hwi-test/libexec/hwi/hwi'
          mkdir -p build-hwi-runtime
          tar -xzf "dist/${{ matrix.artifact }}" -C build-hwi-runtime
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software \
            python contrib/test_bundled_hwi_runtime.py \
            --package-root build-hwi-runtime/bitcoin-qml-hwi-test \
            --executable-relative bin/bitcoin-core-app \
            --hwi-relative libexec/hwi

      - name: Package and ad-hoc sign macOS test app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app=dist/Bitcoin-QML.app
          python contrib/package_hwi_app.py \
            --platform macos \
            --app "${BUILD_DIR}/bin/bitcoin-core-app" \
            --hwi-dir hwi/dist/hwi \
            --public-key "${HWI_MANIFEST_PUBKEY}" \
            --output "${app}"
          QT_QPA_PLATFORM=cocoa QT_QUICK_BACKEND=software \
            python contrib/test_bundled_hwi_runtime.py \
            --package-root "${app}" \
            --executable-relative Contents/MacOS/bitcoin-core-app \
            --hwi-relative Contents/MacOS/libexec/hwi
          manifest_before="$(shasum -a 256 "${app}/Contents/MacOS/libexec/hwi/hwi-manifest.json")"
          codesign --force --sign - --timestamp=none "${app}"
          codesign --verify --deep --strict "${app}"
          manifest_after="$(shasum -a 256 "${app}/Contents/MacOS/libexec/hwi/hwi-manifest.json")"
          test "${manifest_before}" = "${manifest_after}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" "dist/${{ matrix.artifact }}"

      - name: Remove ephemeral HWI private key
        if: always()
        run: |
          test_key="${RUNNER_TEMP}/hwi-manifest-test.key"
          if [ -f "${test_key}" ]; then
            chmod u+w "${test_key}"
            python -c 'import os; p=os.environ["RUNNER_TEMP"] + "/hwi-manifest-test.key"; open(p, "r+b").write(b"\\0" * os.path.getsize(p))'
            rm -f "${test_key}"
          fi

      - name: Upload depends logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: depends-logs-${{ matrix.cache-id }}
          path: bitcoin/depends/*.log
          if-no-files-found: ignore

      - name: Upload untrusted HWI test artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNTRUSTED-TEST-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
